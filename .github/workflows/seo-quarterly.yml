name: SEO Quarterly

permissions:
  contents: write

concurrency:
  group: seo-demand-engine
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 16 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run seed-registry
      - run: npm ci
        working-directory: scripts/seo-orchestrator
      - run: npm run seo:run -- --cadence quarterly --max-tasks 5
        working-directory: scripts/seo-orchestrator
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_STARTING_REF: development
          CURSOR_AGENT_REF: development
      - name: Persist task reservations
        if: always()
        run: >
          bash scripts/persist-seo-git-state.sh
          "Persist SEO task reservations"
          content-registry/task-reservations.json
