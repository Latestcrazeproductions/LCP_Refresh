name: SEO Monthly

permissions:
  contents: write

concurrency:
  group: seo-demand-engine
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 16 1 * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run seed-registry
      - run: npm ci
        working-directory: scripts/seo-orchestrator
      - run: npm run seo:run -- --cadence monthly --max-tasks 6
        working-directory: scripts/seo-orchestrator
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_STARTING_REF: development
          CURSOR_AGENT_REF: development
      - name: Persist research and topic queue state
        if: always()
        run: |
          git config user.name "lcp-seo-bot"
          git config user.email "seo-bot@latestcrazeproductions.com"
          git add content-registry/task-reservations.json \
            content-registry/research.json \
            content-library/topics/national-blog-topics.json \
            content-library/topics/strategy-blog-topics.json \
            content-library/research/briefs/
          if git diff --cached --quiet; then
            echo "No research or reservation changes."
            exit 0
          fi
          git commit -m "Persist SEO research and topic queue state"
          git push origin HEAD:development
