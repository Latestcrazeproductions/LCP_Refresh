name: SEO Monthly

permissions:
  contents: write

concurrency:
  group: seo-demand-engine
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 16 1 * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run seed-registry
      - run: npm ci
        working-directory: scripts/seo-orchestrator
      - name: Validate topic queue JSON
        run: bash scripts/validate-topic-queues.sh
      - run: npm run seo:run -- --cadence monthly --max-tasks 6
        working-directory: scripts/seo-orchestrator
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_STARTING_REF: development
          CURSOR_AGENT_REF: development
      - name: Persist research and topic queue state
        if: always()
        run: >
          bash scripts/persist-seo-git-state.sh
          "Persist SEO research and topic queue state"
          content-registry/task-reservations.json
          content-registry/research.json
          content-library/topics/national-blog-topics.json
          content-library/topics/strategy-blog-topics.json
          content-library/research/briefs/
