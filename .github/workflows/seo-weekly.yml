name: SEO Weekly

permissions:
  contents: write

concurrency:
  group: seo-demand-engine
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 16 * * 1'
  workflow_dispatch:
    inputs:
      max_tasks:
        description: Max tasks per run
        required: false
        default: '1'
      only_type:
        description: Optional task type filter (e.g. service.faq_refresh)
        required: false
        default: ''
      retry_target:
        description: Explicit failed target key to retry
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run seed-registry
      - run: npm ci
        working-directory: scripts/seo-orchestrator
      - name: Dispatch weekly tasks
        run: |
          ARGS="--cadence weekly --max-tasks ${{ inputs.max_tasks || '1' }} --advance-rotation"
          if [ -n "${{ inputs.only_type }}" ]; then
            ARGS="$ARGS --only-type ${{ inputs.only_type }}"
          fi
          if [ -n "${{ inputs.retry_target }}" ]; then
            ARGS="$ARGS --retry-target ${{ inputs.retry_target }}"
          fi
          npm run seo:run -- $ARGS
        working-directory: scripts/seo-orchestrator
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_STARTING_REF: development
          CURSOR_AGENT_REF: development
      - name: Persist scheduler state
        if: always()
        run: |
          git config user.name "lcp-seo-bot"
          git config user.email "seo-bot@latestcrazeproductions.com"
          git add content-registry/rotation.json content-registry/task-reservations.json
          if git diff --cached --quiet; then
            echo "No scheduler state changes."
            exit 0
          fi
          git commit -m "Persist SEO scheduler state"
          git push origin HEAD:development
